l_english:
 menp_cosmo_features_1: "湿件"
 unlocks_features_1: "解锁§Y突触凝练机§!巨型结构科技。\n解锁天灾帝国$crisis_corvette_mod$舰船。"
 menp_cosmo_features_1_desc: "硕大无朋的突触凝练机是一种储备池计算机，以我们人口网络意识的算力用于计算和存储。其优势不言而喻，但一些三观不正的物种会认为这种将个体异化为计算芯片行为视为道德有问题。"

 menp_cosmo_ship_2:"谜题护航舰"
 unlocks_ship_2:"解锁失落帝国的§Y护航舰§!舰船科技。\n解锁天灾帝国$crisis_destroyer_mod$舰船。 \n解锁破解者相关的$small_ship_ed_mod$舰船。 \n解锁$npc_warship_01_mod$舰船。 \n"
 menp_cosmo_ship_2_desc:"解锁各种天灾帝国的小型舰船以及利维坦级无畏战列舰。"
 menp_cosmo_ship_2_desc_regular:"一艘中等大小的星际飞船，它优化了我们对时空的认识以实现维度超越，其内部空间远大于外观所见。与传统舰艇设计相比，它拥有先进火力的同时还降低了后勤成本。\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)，有泰坦科技而且采纳考古工程师飞升以后可以建造无畏战列舰。"

 menp_cosmo_ship_3:"费解巡洋舰"
 unlocks_ship_3:"解锁失落帝国的§Y战列巡洋舰§!舰船科技。\n解锁天灾帝国$galleon_mod$舰船。 \n解锁破解者相关的$medium_ship_ed_mod$舰船。 \n解锁星系热症相关的$ember_cruiser_mod$舰船。\n解锁合成女王相关的$small_ship_synth_queen_mod$舰船。"
 menp_cosmo_ship_3_desc:"解锁各种天灾帝国的中型舰船。"
 menp_cosmo_ship_3_desc_regular:"另一种优化的太空飞船，尺寸更大，让现有的战列舰看起来形同航模一般。\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)。"

 menp_cosmo_ship_4:"莫测旗舰"
 unlocks_ship_4:"解锁失落帝国的§Y泰坦§!舰船科技。\n解锁天灾帝国$crisis_cruiser_mod$舰船。 \n解锁破解者相关的$large_ship_ed_mod$舰船。 \n解锁星系热症相关的$ember_battleship_mod$舰船。\n解锁合成女王相关的$large_ship_synth_queen_mod$舰船。"
 menp_cosmo_ship_4_desc:"解锁各种天灾帝国的大型舰船。"
 menp_cosmo_ship_4_desc_regular:"这些强大的舰船几乎就是一座移动的堡垒，只有最强烈的攻击才有可能伤其分毫。\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)。"

 TECH_UNLOCK_BATTLECRUISER_CONSTRUCTION_TITLE:"§HUnlocks Ship Type:§! \n1.Enigma Battlecruiser\n2.$small_ship_synth_queen$"
 TECH_UNLOCK_BATTLECRUISER_CONSTRUCTION_DESC:"§HEnigma Battlecruiser§!\n§H$small_ship_synth_queen$§!\n$menp_cosmo_ship_3_desc_regular$"
 TECH_UNLOCK_FETITAN_CONSTRUCTION_TITLE:"§HUnlocks Ship Type:§! \n1.Paradox Titan\n2.$large_ship_synth_queen$"
 TECH_UNLOCK_FETITAN_CONSTRUCTION_DESC:"§HParadox Titan§!\n§H$large_ship_synth_queen$§!\n$menp_cosmo_ship_4_desc_regular$"

 ACCORD_FORESIGHT_TT:"Add §G$@foresight_tech_progression|0%$§! progress to currently researched Technologies and 200% research speed within 5 years."
 ACCORD_HINDSIGHT_TT:"Choose a colony you own inside of your §H$PSIONIC_AURA$§!, it becomes a §HRelic World§! with all blockers removed and Add 20 Planet size.\n$ACCORD_LOOSE_INTENSITY$"
 AURA_END_EFFECTS_DESC:"When the §H$end_aura$§! fills the galaxy and no anyone fallen empire, the §H[This.GetName]§! wins the game."

 concept_evopred_genetic_insights_desc:"§YGenetic Insights can be gained by:§!\n$t$—More Organic Species Traits Points or Species Traits Picks\n$t$- Colonizing new planets\n$t$- Purging or keeping other species as Livestock\n$t$- Keeping other species within our Empire as slaves or better\n$t$- Employing alien leaders on our ['concept_council']\n$t$- Keeping vassals with §YGenetic Tithe§! Agreeement\n$t$- For Megacorps, maintaining Commercial Pacts\n$t$- Encountering alien life through events"