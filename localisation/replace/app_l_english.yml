l_english:
 menp_cosmo_features_1:"Wetware"
 unlocks_features_1:"Unlocks the technology for the §YSynaptic Lathe§! Megastructure.\nUnlocks Crisis Empire $crisis_corvette_mod$ ship."
 menp_cosmo_features_1_desc:"Colossal in scale, the Synaptic Lathe is a reservoir computer. The processing power of our population's networked minds is used to compute and store data. The benefits are obvious, but some misguided species may view the transmutation of individuals into computing chips as morally questionable."

 menp_cosmo_ship_2:"Conundrumical Escorts"
 unlocks_ship_2:"Unlocks the technology for the Fallen Empire §YEscort§! ship.\nUnlocks Crisis Empire $crisis_destroyer_mod$ ship. \nUnlocks The Unbidden $small_ship_ed_mod$ ship. \nUnlocks $npc_warship_01_mod$ ship. \nUnlocks bio $mauler_class$ ship.\nUnlocks the technology for the Fallen Empire §YMauler§! and §YWeaver§! ships.\n"
 menp_cosmo_ship_2_desc:"Unlocks various crisis empire small vessel and and leviathan class Dreadnought warship."
 menp_cosmo_ship_2_desc_regular:"A starship of modest size that optimizes our knowledge of spacetime to enact dimensional transcendentalism, making the inside bigger than its outward shape suggests. Advanced firepower capabilities come at a reduced logistical cost compared to traditional ship designs.\nmod provide other crisis empire special ship (need relative dlc purchase)，if you have Titan technology and take Archaeo-Engineers ascension you can build leviathan class Dreadnought warship."

 menp_cosmo_ship_3:"Puzzling Cruisers"
 unlocks_ship_3:"Unlocks the technology for the Fallen Empire §YBattlecruiser§! ship.\nUnlocks Crisis Empire $crisis_cruiser_mod$ ship. \nUnlocks The Unbidden $medium_ship_ed_mod$ ship. \nUnlocks Galactic Hyperthermia $ember_cruiser_mod$ ship.\nUnlocks Synth Queen $small_ship_synth_queen_mod$ ship. \nUnlocks bio $harbinger_class_cap$ ship. \nUnlocks the technology for the Fallen Empire §YHarbinger§!"
 menp_cosmo_ship_3_desc:"Unlocks various crisis empire medium vessel."
 menp_cosmo_ship_3_desc_regular:"Another optimized spacecraft, this time of larger dimensions, will make current Battleships look like toys.\nmod provide other crisis empire special ship (need relative dlc purchase)."

 menp_cosmo_ship_4:"Unsurmisable Flagships"
 unlocks_ship_4:"Unlocks the technology for the Fallen Empire §YTitan§! ship.\nUnlocks Crisis Empire $galleon_mod$ ship. \nUnlocks The Unbidden $large_ship_ed_mod$ ship. \nUnlocks Galactic Hyperthermia $ember_battleship_mod$ ship.\nUnlocks Synth Queen $large_ship_synth_queen_mod$ ship.\nUnlocks bio $stinger_class$ ship. \nUnlocks the technology for the Fallen Empire §YStinger Titan§!"
 menp_cosmo_ship_4_desc:"Unlocks various crisis empire medium vessel."
 menp_cosmo_ship_4_desc_regular:"These formidable ships are closer to mobile fortresses than anything else, and only the most brutal assaults have a chance to damage them.\nmod provide other crisis empire special ship (need relative dlc purchase)."

 unlocks_features_5:"Unlocks the §Y$tech_cosmogenesis_crisis_5$§! technology, that will allow us to build a §YHorizon Needle§! and fulfill our goals.\nUnlocks Synth Queen's Titan. \nUnlocks Behemoth Ship."

 TECH_UNLOCK_BATTLECRUISER_CONSTRUCTION_TITLE:"§HUnlocks Ship Type:§! \n1.Enigma Battlecruiser\n2.$small_ship_synth_queen$"
 TECH_UNLOCK_BATTLECRUISER_CONSTRUCTION_DESC:"§HEnigma Battlecruiser§!\n§H$small_ship_synth_queen$§!\n$menp_cosmo_ship_3_desc_regular$"
