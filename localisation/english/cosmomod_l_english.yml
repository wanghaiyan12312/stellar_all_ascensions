 menp_cosmo_features_1: "Wetware"
 unlocks_features_1: "Unlocks the technology for the §YSynaptic Lathe§! Megastructure.\n解锁天灾帝国$crisis_corvette_mod$舰船。"
 menp_cosmo_features_1_desc: "Colossal in scale, the Synaptic Lathe is a reservoir computer. The processing power of our population's networked minds is used to compute and store data. The benefits are obvious, but some misguided species may view the transmutation of individuals into computing chips as morally questionable."

 menp_cosmo_ship_2: "Conundrumical Escorts"
 unlocks_ship_2: "Unlocks the technology for the Fallen Empire §YEscort§! ship.\n解锁天灾帝国$crisis_destroyer_mod$舰船。 \n解锁破解者相关的$small_ship_ed_mod$舰船。 \n解锁$npc_warship_01_mod$舰船。 \n"
 menp_cosmo_ship_2_desc: "解锁各种天灾帝国的小型舰船以及利维坦级无畏战列舰。"
 menp_cosmo_ship_2_desc_regular: "A starship of modest size that optimizes our knowledge of spacetime to enact dimensional transcendentalism, making the inside bigger than its outward shape suggests. Advanced firepower capabilities come at a reduced logistical cost compared to traditional ship designs.\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)，有泰坦科技而且采纳考古工程师飞升以后可以建造无畏战列舰。"

 menp_cosmo_ship_3: "Puzzling Cruisers"
 unlocks_ship_3: "Unlocks the technology for the Fallen Empire §YBattlecruiser§! ship.\n解锁天灾帝国$galleon_mod$舰船。 \n解锁破解者相关的$medium_ship_ed_mod$舰船。 \n解锁星系热症相关的$ember_cruiser_mod$舰船。\n解锁合成女王相关的$small_ship_synth_queen_mod$舰船。"
 menp_cosmo_ship_3_desc: "解锁各种天灾帝国的中型舰船。"
 menp_cosmo_ship_3_desc_regular: "Another optimized spacecraft, this time of larger dimensions, will make current Battleships look like toys.\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)。"

 menp_cosmo_ship_4: "Unsurmisable Flagships"
 unlocks_ship_4: "Unlocks the technology for the Fallen Empire §YTitan§! ship.\n解锁天灾帝国$crisis_cruiser_mod$舰船。 \n解锁破解者相关的$large_ship_ed_mod$舰船。 \n解锁星系热症相关的$ember_battleship_mod$舰船。\n解锁合成女王相关的$large_ship_synth_queen_mod$舰船。"
 menp_cosmo_ship_4_desc: "解锁各种天灾帝国的大型舰船。"
 menp_cosmo_ship_4_desc_regular: "These formidable ships are closer to mobile fortresses than anything else, and only the most brutal assaults have a chance to damage them.\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)。"

 menp_cosmo_synth_queen_5: "Synth synth_queen_titan_mod_descueen"
 menp_cosmo_synth_queen_5_tt: " Unlocks the §Y$synth_queen_knowledge$§! technology,that will bring us closer to our goals.\nAlso if you have §Y$COLOSSUS_PROJECT$§! ascension perk and §Y$tech_juggernaut$§! technology, you can unlock §Y$tech_synth_queen_titan$§! technology and to build Queen's Titan flagship.\n" 
 menp_cosmo_synth_queen_5_desc: ""Acorrding to legendary of Zarqlan, we use cosmo technology to recall the time record of the synth queen golden age，this give a great technology and ability to build Queen's Titan flagship."

