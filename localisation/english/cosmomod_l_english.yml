 shipeventmod.1.name:"Void Queen"
 shipeventmod.1.desc:"The construction of the impressive Queen's Titan has been completed.\n\nThis mobile behemoth changes the paradigm of offensive warfare entirely. It is equipped with devastating firepower, and a planet kill weapon. Let those Fallen Empire Knee to there New Lord .\n\nOnly fools will oppose [Owner.GetName] now."
 shipeventmod.1.a:"Go forth and conquer!"
 shipeventmod.2.name:"Ultima Ratio Regum"
 shipeventmod.2.desc:"It has been verified that §H[From.Owner.GetName]§! has finished the construction of a massive Queen's Titan ship.  It is equipped with devastating firepower, and a planet kill weapon, making it a superior threat in any combat scenario.\n\nIt is truly the apex armament of space war."
 shipeventmod.2.a:"Bit of a game changer, that one."

