 shipeventmod.1.name:"天佑女王"
 shipeventmod.1.desc:"巨大的女王泰坦的建造已经完成\n\n这艘行动自如的庞然巨舰将彻底改变进攻作战的范式。配他有足以摧枯拉朽的火力，以及一个可以毁灭行星的武器。让那些堕落帝国跪在他们新领主的脚下吧 .\n\n如今只有蠢货才会对抗[Owner.GetName]。"
 shipeventmod.1.a:"前进，征服！"
 shipeventmod.2.name:"女王的杀手锏"
 shipeventmod.2.desc:"经确认，§H[From.Owner.GetName]§!已经完成了女王泰坦的建造。这艘行动自如的庞然巨舰将彻底改变进攻作战的范式。配他有足以摧枯拉朽的火力以及一个可以毁灭行星的武器，使其在任何作战场景下都是更严峻的威胁。\n\n这真的是太空战里的尖端军备。"
 shipeventmod.2.a:"有点改变战争规则的意思了。"

