 menp_cosmo_features_1:"湿件"
 unlocks_features_1:"解锁§Y突触凝练机§!巨型结构科技。\n解锁天灾帝国$crisis_corvette_mod$舰船。"
 menp_cosmo_features_1_desc:"硕大无朋的突触凝练机是一种储备池计算机，以我们人口网络意识的算力用于计算和存储。其优势不言而喻，但一些三观不正的物种会认为这种将个体异化为计算芯片行为视为道德有问题。"

 menp_cosmo_ship_2:"谜题护航舰"
 unlocks_ship_2:"解锁失落帝国的§Y护航舰§!舰船科技。\n解锁天灾帝国$crisis_destroyer_mod$舰船。 \n解锁破界者相关的$small_ship_ed_mod$舰船。 \n解锁$npc_warship_01_mod$舰船。 \n解锁生物舰船$mauler_class$。\n解锁失落帝国的§Y颚蚁§!与§Y织蛛§!舰船科技。\n"
 menp_cosmo_ship_2_desc:"解锁各种天灾帝国的小型舰船以及利维坦级无畏战列舰。"
 menp_cosmo_ship_2_desc_regular:"一艘中等大小的星际飞船，它优化了我们对时空的认识以实现维度超越，其内部空间远大于外观所见。与传统舰艇设计相比，它拥有先进火力的同时还降低了后勤成本。\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)，有泰坦科技而且采纳考古工程师飞升以后可以建造无畏战列舰。"

 menp_cosmo_ship_3:"费解巡洋舰"
 unlocks_ship_3:"解锁失落帝国的§Y战列巡洋舰§!舰船科技。\n解锁天灾帝国$crisis_cruiser_mod$舰船。 \n解锁破界者相关的$medium_ship_ed_mod$舰船。 \n解锁星系热症相关的$ember_cruiser_mod$舰船。\n解锁合成女王相关的$small_ship_synth_queen_mod$舰船。 \n解锁生物舰船$harbinger_class_cap$。 \n解锁失落帝国的§Y孵后§!舰船科技"
 menp_cosmo_ship_3_desc:"解锁各种天灾帝国的中型舰船。"
 menp_cosmo_ship_3_desc_regular:"另一种优化的太空飞船，尺寸更大，让现有的战列舰看起来形同航模一般。\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)。"

 menp_cosmo_ship_4:"莫测旗舰"
 unlocks_ship_4:"解锁失落帝国的§Y泰坦§!舰船科技。\n解锁天灾帝国$galleon_mod$舰船。 \n解锁破界者相关的$large_ship_ed_mod$舰船。 \n解锁星系热症相关的$ember_battleship_mod$舰船。\n解锁合成女王相关的$large_ship_synth_queen_mod$舰船。 \n解锁生物舰船$stinger_class$。 \n解锁失落帝国的§Y泰坦刺蜂§!舰船科技"
 menp_cosmo_ship_4_desc:"解锁各种天灾帝国的大型舰船。"
 menp_cosmo_ship_4_desc_regular:"这些强大的舰船几乎就是一座移动的堡垒，只有最强烈的攻击才有可能伤其分毫。\nmod提供其他灾飞的特殊船模(要拥有相关的dlc)。"

 unlocks_features_5:"解锁§Y$tech_cosmogenesis_crisis_5$§!科技，让我们可以建造一座§Y视界刺针§!，带我们完成目标。\n解锁合成女王合成女王泰坦舰船。\n解锁巨兽之怒贝西摩斯舰船。"
 menp_cosmo_synth_queen_5:"合成女王"
 menp_cosmo_synth_queen_5_tt:"解锁§Y$synth_queen_knowledge$§!科技，带我们迈向目标。\n同时如果你拥有§Y$COLOSSUS_PROJECT$§!飞升并且拥有§Y$tech_juggernaut$§!科技,可以解锁§Y$tech_synth_queen_titan$§!科技建造合成女王的泰坦旗舰。\n"
 menp_cosmo_synth_queen_5_desc:"根据伟大先知扎克的传说记载，我们利用我们宇宙创生的科技去回溯了合成女王巅峰的科技时代这给予了我们伟大的知识以及建造女王泰坦旗舰的能力。"

 cosmo_free_ship_cost_add:"非合金天灾舰船造价维护费修正"
 cosmo_free_ship_cost_add_desc:"由于采用更先进的护盾和装甲，非合金天灾船的造价增加。"

  
 TECH_UNLOCK_ESCORT_CONSTRUCTION_TITLE:"§H解锁舰船类型：§! \n1.密语护航舰 \n2.密文颚蚁 \n3.困境织蛛"
