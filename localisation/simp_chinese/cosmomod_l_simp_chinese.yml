 SHIP_GRAPHICS_NPC_WARSHIP_01_MOD_DESC:"一艘注重护盾防御的古老泰坦，失落帝国早期的实用设计。在不扭曲现实法则下能建造的最大的宇宙战舰，其古老的动力系统仍然需要我们的考古工程师进行一定程度的复原。建造的成本和时间远超失落帝国现在的悖论泰坦战舰，但是其实用的设计可以自行保证维护性"
